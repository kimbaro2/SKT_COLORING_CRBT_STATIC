# Default port. Override: java -jar coloring.war --server.port=8462
server.port=5462
server.servlet.context-path=/
# Server locale: ko_KR.eucKR. Keep request, response, URI, and logs in EUC-KR.
server.servlet.encoding.charset=EUC-KR
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.tomcat.uri-encoding=EUC-KR
logging.charset.console=EUC-KR
logging.charset.file=EUC-KR

# ���� JSESSIONID�� ���� �� ������ ������ �ʰ� �Ѵ�.
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=COLORING_UNUSED
server.servlet.session.cookie.path=/__unused
server.servlet.session.cookie.http-only=true

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=false

logging.level.com.skt.crbt.coloring=INFO

spring.application.name=coloring-static
coloring.description=CRBT Static (Spring Boot WAR)

# Minwon DEBUG log directory. Override: java -jar coloring.war --minwon.log.dir=/path
# System log coloring.log is written in the same directory.
minwon.log.dir=/data/crbt/www/static/admin_new/minwon/log
logging.file.name=${minwon.log.dir}/coloring.log
