<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<HTML><HEAD><TITLE>CRBT 통계</TITLE>
<META http-equiv=Content-Type content="text/html; charset=euc-kr"><LINK href="default.css" rel=stylesheet>

<script language="JavaScript">

function goAuth() {
	if (document.login.id.value.length == 0)
	{
		alert("사용자 ID를 입력해 주세요.");
		return false;
	}
	if (document.login.passwd.value.length == 0)
	{
		alert("사용자 Password를 입력해 주세요.");
		return false;
	}
	
	document.login.action='/rankstatic/login';
	document.login.method='POST';
	document.login.submit();
}

function checkIt(f) { 
	if (f.userid.value.length==0){ 
		f.id.focus();
		return false;
	}
	if (f.passwd.value.length==0){ 
		f.passwd.focus();
		return false;
	}
	return true;
}

</script>


<BODY leftmargin="0" topmargin="0" marginwidth="0" marginheight="0" onload="document.login.id.focus();"> 
<form name=login> 
<br><br><br><br><br><br><br><br>
<h2 align=center>CRBT Statistic v2</h2>  <br>
<table  cellpadding=5 align=center>

<tr bgcolor='#e6e6fa'><td>
ID
</td><td>
<input name=id>
</td></tr>
<tr bgcolor='#d3d3d3'><td>
PASSWORD
</td><td>
<input type=password name=passwd >
</td></tr>
<tr><td colspan=2 align=center>
<br><br>
<input type=submit value="로그인" onClick="goAuth();">
&nbsp&nbsp&nbsp
<input type=reset value="취소">
</td></tr>
</table>
</form>
</center>
</body>
</html>
